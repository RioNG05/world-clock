<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock</title>
    <link rel="stylesheet" href="./assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1 class="title">🌍 World Clock</h1>
            <div class="controls">
                <span class="mode-label">Display Mode:</span>
                <div class="custom-select">
                    <select id="display-mode">
                        <option value="both" selected>Both</option>
                        <option value="digital">Digital</option>
                        <option value="analog">Analog</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="clock-grid" id="clock-container">
            <!-- Clock cards will be generated by JS -->
        </main>
    </div>

    <!-- Template for a clock card -->
    <template id="clock-card-template">
        <div class="clock-card">
            <div class="location">
                <span class="country-code"></span>
                <span class="city-name"></span>
            </div>
            <div class="digital-container">
                <div class="digital-time"></div>
                <div class="date"></div>
            </div>
            <div class="analog-container">
                <div class="analog-clock">
                    <div class="center-dot"></div>
                    <div class="hand hour-hand"></div>
                    <div class="hand min-hand"></div>
                    <div class="hand sec-hand"></div>
                    <!-- Numbers will be added via JS -->
                    <div class="numbers-container"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="./assets/script.js"></script>
</body>

</html>
